<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فوتبالیست ها و رسا</title>

<style>
body{
    margin:0;
    font-family:Tahoma, Arial;
    background:
    linear-gradient(#0008,#0008),
    url("https://images.unsplash.com/photo-1574629810360-7efbbe195018");
    background-size:cover;
    min-height:100vh;
    color:white;
    text-align:center;
}

.box{
    margin:50px auto;
    max-width:450px;
    background:#111c;
    padding:30px;
    border-radius:25px;
}

h1{
    color:#ffd700;
    font-size:35px;
}

input{
    width:80%;
    padding:12px;
    border-radius:10px;
    border:0;
    font-size:16px;
}

button{
    padding:12px 20px;
    margin:10px;
    border:0;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
}

.green{
    background:#009900;
    color:white;
}

.yellow{
    background:#e5a900;
}

.red{
    background:#cc0000;
    color:white;
}
</style>

</head>

<body>

<div class="box">

<h1>⚽ فوتبالیست ها و رسا</h1>

<p>ثبت حضور بازیکنان</p>

<input id="name" placeholder="اسم بازیکن">

<br>

<button class="green" onclick="save('میام')">
🟢 میام
</button>

<button class="yellow" onclick="save('شاید')">
🟡 شاید
</button>

<button class="red" onclick="save('نمیام')">
🔴 نمیام
</button>

<p id="msg"></p>

</div>


<script>

const SUPABASE_URL = "https://vviuzqnnnghaidnwyomt.supabase.co";

const SUPABASE_KEY =const SUPABASE_KEY =const SUPABASE_KEY = "sb_publishable_olTL-pgnq7q-RISyGG0Mjw_vI7Ofl_T";


async function save(status){

let name = document.getElementById("name").value;


if(name.trim() === ""){
alert("اسم را وارد کن");
return;
}


let result = await fetch(
SUPABASE_URL + "/rest/v1/players",
{
method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer " + SUPABASE_KEY,
"Content-Type":"application/json"
},

body:JSON.stringify({
name:name,
status:status
})

});


if(result.ok){

document.getElementById("msg").innerHTML="✅ ثبت شد";
document.getElementById("name").value="";

}else{

document.getElementById("msg").innerHTML="❌ خطا در ثبت";

}

}

</script>


</body>
</html>
