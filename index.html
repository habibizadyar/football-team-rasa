<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فوتبالیست ها و رسا</title>

<style>

body{
margin:0;
font-family:Tahoma,Arial;
background:
linear-gradient(#0008,#0008),
url("https://images.unsplash.com/photo-1574629810360-7efbbe195018");
background-size:cover;
min-height:100vh;
color:white;
text-align:center;
}

.box{
margin:40px auto;
max-width:450px;
background:#111c;
padding:25px;
border-radius:25px;
}

h1{
color:#ffd700;
font-size:32px;
}

input{
width:85%;
padding:12px;
border-radius:12px;
border:0;
font-size:17px;
}

button{
padding:12px 20px;
margin:8px;
border:0;
border-radius:15px;
cursor:pointer;
font-size:17px;
}

.green{
background:#00a000;
color:white;
}

.yellow{
background:#e5a900;
}

.red{
background:#c00;
color:white;
}

.card{

margin-top:25px;
background:#ffffff22;
padding:20px;
border-radius:20px;

}

.card img{

width:100px;
height:100px;
border-radius:50%;
object-fit:cover;

}

#msg{
font-size:20px;
}

</style>

</head>


<body>


<div class="box">


<h1>⚽ فوتبالیست ها و رسا</h1>

<p>ثبت حضور بازیکنان</p>


<input id="name" placeholder="اسم بازیکن">


<br>


<button class="green" onclick="save('میام')">
🟢 میام
</button>


<button class="yellow" onclick="save('شاید')">
🟡 شاید
</button>


<button class="red" onclick="save('نمیام')">
🔴 نمیام
</button>


<p id="msg"></p>


<div id="players"></div>


</div>



<script>


const URL =
"https://vviuzqnnnghaidnwyomt.supabase.co";


const KEY =
"sb_publishable_olTL-pgnq7q-RISyGG0Mjw_vI7Ofl_T";



async function save(status){


let name =
document.getElementById("name").value.trim();



if(name==""){

alert("اسم رو وارد کن");
return;

}



let today =
new Date().toISOString().split("T")[0];



// پیدا کردن بازیکن

let find =
await fetch(
URL+
"/rest/v1/players?name=eq."+name,
{

headers:{
"apikey":KEY,
"Authorization":"Bearer "+KEY
}

});


let data =
await find.json();



// اگر امروز ثبت کرده

if(data.length>0 &&
data[0].last_vote_date==today){

alert(
"⚠️ امروز قبلاً ثبت کردی. فردا دوباره میشه."
);

return;

}



let player = data[0];



let come =
player ? player.come_count : 0;


let no =
player ? player.no_count : 0;


let score =
player ? player.score : 0;



if(status=="میام"){

come++;
score+=3;

}


if(status=="نمیام"){

no++;
score-=1;

}


if(status=="شاید"){

score+=1;

}





let body={

name:name,

status:status,

come_count:come,

no_count:no,

score:score,

last_vote_date:today

};





let result;



if(player){


// آپدیت بازیکن

result =
await fetch(
URL+
"/rest/v1/players?id=eq."+player.id,
{

method:"PATCH",

headers:{
"apikey":KEY,
"Authorization":"Bearer "+KEY,
"Content-Type":"application/json"
},

body:JSON.stringify(body)

});


}else{


// ساخت بازیکن جدید

result =
await fetch(
URL+
"/rest/v1/players",
{

method:"POST",

headers:{
"apikey":KEY,
"Authorization":"Bearer "+KEY,
"Content-Type":"application/json"
},

body:JSON.stringify(body)

});


}



if(result.ok){

document.getElementById("msg")
.innerHTML="✅ ثبت شد";

document.getElementById("name").value="";


loadPlayers();


}else{


document.getElementById("msg")
.innerHTML="❌ خطا در ثبت";


}



}





async function loadPlayers(){


let res =
await fetch(
URL+
"/rest/v1/players",
{

headers:{
"apikey":KEY,
"Authorization":"Bearer "+KEY
}

});


let players =
await res.json();



let html="";



players.forEach(p=>{


html+=`

<div class="card">


<img src="${p.photo || 'https://via.placeholder.com/100'}">


<h2>${p.name}</h2>


<p>
وضعیت: ${p.status}
</p>


<p>
🟢 حضور: ${p.come_count}
</p>


<p>
🔴 غیبت: ${p.no_count}
</p>


<p>
⭐ امتیاز: ${p.score}
</p>


</div>


`;



});



document.getElementById("players")
.innerHTML=html;


}



loadPlayers();


</script>


</body>

</html>
