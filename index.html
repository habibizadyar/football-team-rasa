<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Footballers ⚽</title>

<style>

* {
    box-sizing: border-box;
    font-family: Tahoma, Arial, sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    color: #fff;

    background:
        radial-gradient(circle at 50% -10%, rgba(255,215,0,0.20), transparent 35%),
        radial-gradient(circle at 10% 30%, rgba(255,190,0,0.06), transparent 30%),
        radial-gradient(circle at 90% 70%, rgba(255,215,0,0.05), transparent 30%),
        linear-gradient(135deg, #050505, #101010 45%, #050505);
}

/* =========================
   HEADER
========================= */

header {
    position: relative;
    overflow: hidden;

    text-align: center;

    padding: 35px 20px 40px;

    background:
        linear-gradient(135deg, #000000 0%, #211900 45%, #050505 100%);

    border-bottom: 2px solid #ffd700;

    box-shadow:
        0 10px 40px rgba(255,215,0,0.12),
        inset 0 -1px 0 rgba(255,255,255,0.04);
}

header::before {
    content: "";
    position: absolute;

    width: 280px;
    height: 280px;

    border-radius: 50%;

    background: rgba(255,215,0,0.05);

    top: -160px;
    left: 50%;

    transform: translateX(-50%);
}

header::after {
    content: "⚽";

    position: absolute;

    right: -35px;
    bottom: -65px;

    font-size: 180px;

    opacity: 0.035;

    transform: rotate(-15deg);
}

.logo {
    position: relative;
    z-index: 2;

    font-size: 72px;

    filter:
        drop-shadow(0 0 15px rgba(255,215,0,0.35));
}

header h1 {
    position: relative;
    z-index: 2;

    margin: 10px 0 6px;

    color: #ffd700;

    font-size: 44px;
    letter-spacing: 1px;

    text-shadow:
        0 0 15px rgba(255,215,0,0.25);
}

header p {
    position: relative;
    z-index: 2;

    margin: 0;

    color: #ddd;

    font-size: 17px;
}

/* =========================
   CONTAINER
========================= */

.container {
    width: 100%;
    max-width: 1150px;

    margin: auto;

    padding: 22px 18px 50px;
}

/* =========================
   MENU
========================= */

.menu {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

    margin-bottom: 22px;
}

.menu button {
    position: relative;
    overflow: hidden;

    border: 1px solid rgba(255,215,0,0.65);

    padding: 16px 12px;

    border-radius: 18px;

    background:
        linear-gradient(135deg, #ffd700, #c79d00);

    color: #080808;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.25s;

    box-shadow:
        0 5px 18px rgba(255,215,0,0.10);
}

.menu button::after {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 60%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.25),
            transparent
        );

    transition: 0.5s;
}

.menu button:hover::after {
    left: 130%;
}

.menu button:hover {
    transform: translateY(-3px);

    box-shadow:
        0 10px 28px rgba(255,215,0,0.20);
}

.menu button:active {
    transform: scale(0.98);
}

/* =========================
   PAGE
========================= */

.page {
    position: relative;
    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            rgba(25,25,25,0.98),
            rgba(8,8,8,0.98)
        );

    border: 1px solid rgba(255,215,0,0.75);

    border-radius: 28px;

    padding: 25px;

    box-shadow:
        0 0 30px rgba(255,215,0,0.07),
        inset 0 0 40px rgba(255,215,0,0.025);
}

.page::before {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    border-radius: 50%;

    background: rgba(255,215,0,0.025);

    left: -80px;
    top: -80px;

    pointer-events: none;
}

.hidden {
    display: none !important;
}

.page-title {
    position: relative;

    text-align: center;

    color: #ffd700;

    font-size: 30px;

    margin: 0 0 24px;

    text-shadow:
        0 0 12px rgba(255,215,0,0.15);
}

.page-title::after {
    content: "";

    display: block;

    width: 90px;
    height: 3px;

    margin: 10px auto 0;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ffd700,
            transparent
        );
}

/* =========================
   INPUTS
========================= */

input,
select {
    width: 100%;

    padding: 14px;

    margin: 7px 0;

    border-radius: 14px;

    border: 1px solid #444;

    background: #181818;

    color: #fff;

    font-size: 16px;

    outline: none;

    transition: 0.2s;
}

input:focus,
select:focus {
    border-color: #ffd700;

    box-shadow:
        0 0 10px rgba(255,215,0,0.08);
}

select {
    cursor: pointer;
}

select option {
    background: #111;
    color: #fff;
}

input[type="file"] {
    padding: 10px;

    cursor: pointer;
}

/* =========================
   BUTTONS
========================= */

button {
    cursor: pointer;
}

.primary-btn {
    width: 100%;

    border: none;

    border-radius: 15px;

    padding: 14px;

    margin-top: 8px;

    background:
        linear-gradient(135deg, #ffd700, #c99f00);

    color: #000;

    font-weight: bold;

    font-size: 16px;

    transition: 0.2s;
}

.primary-btn:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 20px rgba(255,215,0,0.18);
}

/* =========================
   ATTENDANCE
========================= */

.status-buttons {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    margin-top: 12px;
}

.status-buttons button {
    border: none;

    padding: 16px;

    border-radius: 16px;

    font-size: 17px;

    font-weight: bold;

    transition: 0.2s;
}

.status-buttons button:hover {
    transform: translateY(-2px);

    filter: brightness(1.1);
}

.green {
    background:
        linear-gradient(135deg, #00a83b, #006d27);

    color: white;
}

.red {
    background:
        linear-gradient(135deg, #d00000, #870000);

    color: white;
}

.yellow {
    background:
        linear-gradient(135deg, #e0c000, #a48b00);

    color: #000;
}

.message {
    margin-top: 15px;

    padding: 13px;

    text-align: center;

    background:
        linear-gradient(135deg, #191919, #101010);

    border: 1px solid #333;

    border-radius: 14px;

    color: #bbb;
}

.attendance-section {
    background:
        linear-gradient(145deg, #191919, #101010);

    border: 1px solid #333;

    border-radius: 18px;

    padding: 17px;

    margin-top: 14px;

    box-shadow:
        inset 0 0 20px rgba(255,255,255,0.015);
}

.attendance-section h3 {
    margin-top: 0;

    color: #ffd700;

    border-bottom: 1px solid #333;

    padding-bottom: 9px;
}

.attendance-names {
    line-height: 2.2;

    font-size: 17px;
}

/* =========================
   PLAYER CARDS GRID
========================= */

.cards {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(270px, 1fr));

    gap: 22px;
}

/* =========================
   FIFA CARD
========================= */

.fifa-card {
    position: relative;

    min-height: 480px;

    overflow: hidden;

    border-radius: 28px;

    padding: 18px;

    text-align: center;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(255,215,0,0.16),
            transparent 34%
        ),
        linear-gradient(
            145deg,
            #806500 0%,
            #392e08 20%,
            #151305 48%,
            #080808 75%,
            #403300 100%
        );

    border: 3px solid #dcb500;

    box-shadow:
        0 0 20px rgba(255,215,0,0.15),
        0 18px 35px rgba(0,0,0,0.45),
        inset 0 0 35px rgba(255,215,0,0.07);

    transition: 0.3s;
}

.fifa-card:hover {
    transform: translateY(-7px);

    box-shadow:
        0 0 30px rgba(255,215,0,0.25),
        0 20px 40px rgba(0,0,0,0.55),
        inset 0 0 40px rgba(255,215,0,0.09);
}

.fifa-card::before {
    content: "";

    position: absolute;

    inset: 8px;

    border: 1px solid rgba(255,215,0,0.38);

    border-radius: 22px;

    pointer-events: none;
}

.fifa-card::after {
    content: "⚽";

    position: absolute;

    left: -25px;
    bottom: -35px;

    font-size: 145px;

    opacity: 0.035;

    pointer-events: none;
}

/* =========================
   CARD TOP
========================= */

.card-top {
    position: relative;

    z-index: 2;

    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    padding: 5px 8px;
}

.rating {
    color: #ffd700;

    font-size: 48px;

    font-weight: bold;

    line-height: 1;

    text-shadow:
        0 0 10px rgba(255,215,0,0.20);
}

.rating-label {
    color: #aaa;

    font-size: 11px;

    margin-top: 5px;
}

.position {
    color: #eee;

    font-size: 18px;

    margin-top: 6px;
}

.status-badge {
    background:
        rgba(0,0,0,0.40);

    border: 1px solid rgba(255,215,0,0.25);

    border-radius: 20px;

    padding: 7px 10px;

    font-size: 14px;
}

/* =========================
   PLAYER PHOTO
========================= */

.player-photo {
    position: relative;

    z-index: 2;

    width: 205px;
    height: 205px;

    margin: 7px auto 12px;

    display: block;

    object-fit: cover;

    border-radius: 50%;

    border: 4px solid #ffd700;

    background: #222;

    box-shadow:
        0 0 25px rgba(255,215,0,0.25);
}

.no-photo {
    position: relative;

    z-index: 2;

    width: 205px;
    height: 205px;

    margin: 7px auto 12px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border: 4px solid #ffd700;

    background:
        radial-gradient(circle, #333, #111);

    font-size: 75px;

    box-shadow:
        0 0 25px rgba(255,215,0,0.20);
}

/* =========================
   PLAYER NAME
========================= */

.fifa-name {
    position: relative;

    z-index: 2;

    color: #ffd700;

    font-size: 28px;

    font-weight: bold;

    margin: 8px 0;

    text-shadow:
        0 0 10px rgba(255,215,0,0.15);
}

/* =========================
   AGE
========================= */

.age {
    position: relative;

    z-index: 2;

    color: #ddd;

    font-size: 15px;

    margin-bottom: 15px;
}

/* =========================
   CARD STATS
========================= */

.card-stats {
    position: relative;

    z-index: 2;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;

    margin-top: 10px;
}

.card-stat {
    background:
        rgba(0,0,0,0.45);

    border: 1px solid rgba(255,215,0,0.28);

    border-radius: 13px;

    padding: 9px 4px;
}

.card-stat span {
    display: block;

    color: #ccc;

    font-size: 12px;
}

.card-stat strong {
    display: block;

    color: #ffd700;

    font-size: 21px;

    margin-top: 3px;
}

/* =========================
   ADMIN
========================= */

.admin-box {
    background:
        linear-gradient(145deg, #191919, #101010);

    border: 1px solid #333;

    border-radius: 20px;

    padding: 20px;

    margin-bottom: 25px;

    box-shadow:
        inset 0 0 25px rgba(255,215,0,0.025);
}

.admin-box h3 {
    color: #ffd700;

    text-align: center;

    margin-top: 0;

    font-size: 21px;
}

.admin-label {
    display: block;

    color: #aaa;

    font-size: 13px;

    margin-top: 9px;
}

.admin-card {
    text-align: right;
}

.admin-card h3 {
    color: #ffd700;

    text-align: center;

    margin-top: 0;
}

.admin-photo-preview {
    width: 110px;
    height: 110px;

    margin: 5px auto 12px;

    display: block;

    object-fit: cover;

    border-radius: 50%;

    border: 3px solid #ffd700;

    background: #222;
}

.admin-no-photo {
    width: 110px;
    height: 110px;

    margin: 5px auto 12px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border: 3px solid #ffd700;

    background: #222;

    font-size: 45px;
}

.save-btn {
    width: 100%;

    padding: 13px;

    margin-top: 12px;

    border: none;

    border-radius: 14px;

    background:
        linear-gradient(135deg, #ffd700, #c49a00);

    color: #000;

    font-weight: bold;

    font-size: 15px;
}

.save-btn:hover {
    filter: brightness(1.08);
}

.delete-btn {
    width: 100%;

    padding: 11px;

    margin-top: 8px;

    border: none;

    border-radius: 14px;

    background:
        linear-gradient(135deg, #b40000, #750000);

    color: white;

    font-weight: bold;
}

.delete-btn:hover {
    filter: brightness(1.12);
}

/* =========================
   EMPTY
========================= */

.empty {
    text-align: center;

    color: #aaa;

    padding: 30px;

    background: #121212;

    border: 1px dashed #444;

    border-radius: 18px;
}

/* =========================
   LOADING
========================= */

.loading {
    text-align: center;

    color: #ffd700;

    padding: 30px;

    font-size: 17px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .menu {
        grid-template-columns: 1fr;
    }

    .status-buttons {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 35px;
    }

    .logo {
        font-size: 58px;
    }

    .page {
        padding: 17px;
    }

    .fifa-card {
        min-height: 460px;
    }

    .player-photo,
    .no-photo {
        width: 185px;
        height: 185px;
    }

    .cards {
        grid-template-columns: 1fr;
    }
}

</style>

/* =========================

========================= */

window.showPage = function(pageId) {

    const pages = [
        "attendancePage",
        "playersPage",
        "adminPage"
    ];


    pages.forEach(id => {

        const page =

        });

/* =========================
   STATUS ICON
========================= */

function statusIcon(status) {

    if (status === "میام") {
        return "🟢";
    }

    if (status === "نمیام") {
        return "🔴";
    }

    if (status === "شاید") {
        return "🟡";
    }

    return "⚪";
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   IMAGE COMPRESS
========================= */

function imageToBase64(file) {

    return new Promise((resolve, reject) => {

        const reader =
            new FileReader();


        reader.onload = function(event) {

            const img =
                new Image();


            img.onload = function() {

                const maxSize = 600;

                let width = img.width;
                let height = img.height;


                if (width > height) {

                    if (width > maxSize) {

                        height =
                            height * maxSize / width;

                        width = maxSize;

                    }

                }
                else {

                    if (height > maxSize) {

                        width =
                            width * maxSize / height;

                        height = maxSize;

                    }

                }


                const canvas =
                    document.createElement("canvas");


                canvas.width = width;
                canvas.height = height;


                const ctx =
                    canvas.getContext("2d");


                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );


                resolve(
                    canvas.toDataURL(
                        "image/jpeg",
                        0.82
                    )
                );

            };


            img.onerror = reject;

            img.src = event.target.result;

        };


        reader.onerror = reject;

        reader.readAsDataURL(file);

    });

}

            snapshot.forEach(item => {

                const player =
                    item.val();


                html += `
                    <option value="${item.key}">
                        ${escapeHtml(player.name)}
                    </option>
                `;

            });


            select.innerHTML = html;


            if (currentValue) {

                const option =
                    select.querySelector(
                        `option[value="${currentValue}"]`
                    );

                if (option) {
                    select.value = currentValue;
                }

            }

        }
    );

}

========================= */

async function saveAttendance(status) {

    const select =
        document.getElementById(
            "attendancePlayer"
        );


    const message =
        document.getElementById(
            "attendanceMessage"
        );


    const id =
        select.value;


    if (!id) {

        message.textContent =
            "اول بازیکنت رو انتخاب کن ⚽";

        return;

    }


    try {

        await update(
            ref(db, "players/" + id),
            {
                status: status
            }
        );


        message.textContent =
            "اعلام حضورت با موفقیت ثبت شد ✅";

    }
    catch(error) {

        console.error(error);

        message.textContent =
            "ثبت اعلام حضور انجام نشد ❌";

    }

}

/* =========================
   LOAD ATTENDANCE
========================= */

function loadAttendance() {

    onValue(
        ref(db, "players"),
        snapshot => {

            const come = [];
            const no = [];
            const maybe = [];


            snapshot.forEach(item => {

                const player =
                    item.val();


                if (player.status === "میام") {

                    come.push(player.name);

                }

                else if (
                    player.status === "نمیام"
                ) {

                    no.push(player.name);

                }

                else if (
                    player.status === "شاید"
                ) {

                    maybe.push(player.name);

                }

            });


            const makeNames = (
                names,
                icon
            ) => {

                if (!names.length) {
                    return "کسی ثبت نکرده";
                }


                return names
                    .map(
                        name =>
                            icon +
                            " " +
                            escapeHtml(name)
                    )
                    .join("<br>");

            };


            const html = `

                <div class="attendance-section">

                    <h3>
                        🟢 میان
                        (${come.length})
                    </h3>

                    <div class="attendance-names">
                        ${makeNames(come, "🟢")}
                    </div>

                </div>


                <div class="attendance-section">

                    <h3>
                        🔴 نمیان
                        (${no.length})
                    </h3>

                    <div class="attendance-names">
                        ${makeNames(no, "🔴")}
                    </div>

                </div>


                <div class="attendance-section">

                    <h3>
                        🟡 شاید
                        (${maybe.length})
                    </h3>

                    <div class="attendance-names">
                        ${makeNames(maybe, "🟡")}
                    </div>

                </div>

            `;


            document
                .getElementById(
                    "attendanceList"
                )
                .innerHTML = html;

        }
    );

}


/* =========================
   LOAD PLAYER CARDS
========================= */

function loadPlayers() {

    onValue(
        ref(db, "players"),
        snapshot => {

            const players = [];


            snapshot.forEach(item => {

                players.push({

                    id: item.key,

                    ...item.val()

                });

            });


            players.sort(
                (a, b) =>
                    (Number(b.score) || 0) -
                    (Number(a.score) || 0)
            );


            const container =
                document.getElementById(
                    "playerCards"
                );


            if (!players.length) {

                container.innerHTML = `

                    <div class="empty">

                        هنوز بازیکنی اضافه نشده ⚽

                        <br><br>

                        مدیر تیم باید بازیکن‌ها را از پنل مدیریت اضافه کند.

                    </div>

                `;

                return;

            }


            let html = "";


            players.forEach(player => {

                const score =
                    Number(player.score) || 0;

                const goals =
                    Number(player.goals) || 0;

                const assists =
                    Number(player.assists) || 0;

                const games =
                    Number(player.games) || 0;

                const age =
                    Number(player.age) || 0;


                let photoHtml = "";


                if (player.photo) {

                    photoHtml = `

                        <img
                            class="player-photo"
                            src="${player.photo}"
                            alt="${escapeHtml(player.name)}"
                        >

                    `;

                }
                else {

                    photoHtml = `

                        <div class="no-photo">
                            ⚽
                        </div>

                    `;

                }


                html += `

                    <div class="fifa-card">


                        <div class="card-top">

                            <div>

                                <div class="rating">
                                    ${score}
                                </div>

                                <div class="rating-label">
                                    RATING
                                </div>

                                <div class="position">
                                    ⚽
                                </div>

                            </div>


                            <div class="status-badge">

                                ${statusIcon(player.status)}

                            </div>

                        </div>


                        ${photoHtml}


                        <div class="fifa-name">

                            ${escapeHtml(player.name)}

                        </div>


                        <div class="age">

                            🎂 سن:
                            ${
                                age > 0
                                ? age
                                : "ثبت نشده"
                            }

                        </div>


                        <div class="card-stats">


                            <div class="card-stat">

                                ⚽

                                <span>
                                    گل
                                </span>

                                <strong>
                                    ${goals}
                                </strong>

                            </div>


                            <div class="card-stat">

                                🎯

                                <span>
                                    پاس گل
                                </span>

                                <strong>
                                    ${assists}
                                </strong>

                            </div>


                            <div class="card-stat">

                                🏟

                                <span>
                                    بازی
                                </span>

                                <strong>
                                    ${games}
                                </strong>

                            </div>


                        </div>


                    </div>

                `;

            });


            container.innerHTML =
                html;

        }
    );

}

/* =========================
   ADD NEW PLAYER
========================= */

async function addNewPlayer() {

    const nameInput =
        document.getElementById(
            "newPlayerName"
        );


    const ageInput =
        document.getElementById(
            "newPlayerAge"
        );


    const photoInput =
        document.getElementById(
            "newPlayerPhoto"
        );


    const name =
        nameInput.value.trim();


    const age =
        Number(ageInput.value) || 0;


    if (!name) {

        alert(
            "اسم بازیکن را وارد کن ⚽"
        );

        return;

    }


    if (
        age < 1 ||
        age > 100
    ) {

        alert(
            "سن بازیکن را درست وارد کن 🎂"
        );

        return;

    }


    try {

        let photo = "";


        if (
            photoInput.files &&
            photoInput.files.length > 0
        ) {

            const file =
                photoInput.files[0];


            if (
                file.size >
                8 * 1024 * 1024
            ) {

                alert(
                    "حجم عکس باید کمتر از 8 مگابایت باشد."
                );

                return;

            }


            photo =
                await imageToBase64(file);

        }


        const playerRef =
            push(
                ref(db, "players")
            );


        await set(
            playerRef,
            {

                name: name,

                age: age,

                photo: photo,

                status: "شاید",

                goals: 0,

                assists: 0,

                games: 0,

                score: 0

            }
        );


        nameInput.value = "";

        ageInput.value = "";

        photoInput.value = "";


        alert(
            "بازیکن با موفقیت اضافه شد ✅"
        );

    }
    catch(error) {

        console.error(error);

        alert(
            "اضافه کردن بازیکن انجام نشد ❌"
        );

    }

}

/* =========================
   SAVE PLAYER
========================= */

window.saveStats =
async function(id) {

    const nameInput =
        document.getElementById(
            "name-" + id
        );


    const ageInput =
        document.getElementById(
            "age-" + id
        );


    const photoInput =
        document.getElementById(
            "photo-" + id
        );


    const goalsInput =
        document.getElementById(
            "goals-" + id
        );


    const assistsInput =
        document.getElementById(
            "assists-" + id
        );


    const gamesInput =
        document.getElementById(
            "games-" + id
        );


    const scoreInput =
        document.getElementById(
            "score-" + id
        );


    if (
        !nameInput ||
        !ageInput ||
        !goalsInput ||
        !assistsInput ||
        !gamesInput ||
        !scoreInput
    ) {

        alert(
            "اطلاعات بازیکن پیدا نشد ❌"
        );

        return;

    }


    const name =
        nameInput.value.trim();


    const age =
        Number(ageInput.value) || 0;


    if (!name) {

        alert(
            "نام بازیکن نمی‌تواند خالی باشد ❌"
        );

        return;

    }


    if (
        age < 1 ||
        age > 100
    ) {

        alert(
            "سن بازیکن درست نیست ❌"
        );

        return;

    }


    try {

        const data = {

            name: name,

            age: age,

            goals:
                Number(
                    goalsInput.value
                ) || 0,

            assists:
                Number(
                    assistsInput.value
                ) || 0,

            games:
                Number(
                    gamesInput.value
                ) || 0,

            score:
                Math.min(
                    99,
                    Number(
                        scoreInput.value
                    ) || 0
                )

        };


        if (
            photoInput &&
            photoInput.files &&
            photoInput.files.length > 0
        ) {

            const file =
                photoInput.files[0];


            if (
                file.size >
                8 * 1024 * 1024
            ) {

                alert(
                    "حجم عکس باید کمتر از 8 مگابایت باشد."
                );

                return;

            }


            data.photo =
                await imageToBase64(file);

        }


        await update(
            ref(
                db,
                "players/" + id
            ),
            data
        );


        alert(
            "اطلاعات بازیکن با موفقیت ذخیره شد ✅"
        );

    }
    catch(error) {

        console.error(error);

        alert(
            "ذخیره اطلاعات انجام نشد ❌"
        );

    }

};


/* =========================
   DELETE PLAYER
========================= */

window.deletePlayer =
async function(id) {

    const answer =
        confirm(
            "مطمئنی می‌خواهی این بازیکن را حذف کنی؟"
        );


    if (!answer) {
        return;
    }


    try {

        await remove(
            ref(
                db,
                "players/" + id
            )
        );


        alert(
            "بازیکن حذف شد ✅"
        );

    }
    catch(error) {

        console.error(error);

        alert(
            "حذف بازیکن انجام نشد ❌"
        );

    }

};
