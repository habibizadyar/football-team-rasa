<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Footballers ⚽</title>


<style>

*{
box-sizing:border-box;
font-family:Tahoma;
}


body{
margin:0;
background:#050505;
color:white;
}



header{

background:linear-gradient(135deg,#000,#3a2b00);
padding:30px;
text-align:center;
border-bottom:3px solid gold;

}



.logo{
font-size:70px;
}



h1{
color:#ffd700;
font-size:45px;
margin:10px;
}



.container{

max-width:1000px;
margin:auto;
padding:20px;

}



.menu{

display:flex;
gap:15px;
flex-wrap:wrap;
justify-content:center;
margin-top:20px;

}



.menu button{

background:gold;
border:none;
padding:15px 25px;
border-radius:25px;
font-size:18px;
font-weight:bold;
cursor:pointer;

}



.box{

background:#111;
border:2px solid gold;
border-radius:25px;
padding:25px;
margin-top:25px;
box-shadow:0 0 25px #ffd70055;

}



.hidden{

display:none;

}



input{

width:100%;
padding:15px;
border-radius:15px;
border:none;
font-size:18px;
margin:10px 0;

}



.status{

display:flex;
gap:10px;

}



.status button{

flex:1;
padding:15px;
border:none;
border-radius:20px;
font-weight:bold;
cursor:pointer;

}



.green{
background:#009933;
color:white;
}



.red{
background:#cc0000;
color:white;
}



.yellow{
background:#d6b600;
}



.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;

}



.card{

background:linear-gradient(145deg,#3a2b00,#111);
border:3px solid gold;
border-radius:25px;
padding:20px;
text-align:center;

}



</style>

</head>



<body>


<header>

<div class="logo">
⚽
</div>


<h1>
Footballers
</h1>


<p>
پنل فوتبال دوستان
</p>


</header>





<div class="container">



<div class="menu">


<button onclick="showPage('attendance')">
🟢 اعلام ثبت حضور
</button>



<button onclick="showPage('players')">
🏆 اطلاعات بازیکنان
</button>



<button onclick="showPage('admin')">
🔐 پنل مدیریت
</button>



</div>





<!-- ثبت حضور -->

<div id="attendance" class="box">


<h2>
⚽ اعلام حضور
</h2>


<input id="playerName"
placeholder="اسم خودتو وارد کن">



<div class="status">


<button class="green">
🟢 میام
</button>


<button class="red">
🔴 نمیام
</button>


<button class="yellow">
🟡 شاید
</button>


</div>


</div>







<!-- اطلاعات بازیکنان -->


<div id="players" class="box hidden">


<h2>
🏆 کارت بازیکنان
</h2>


<div id="playersList" class="cards">

در حال بارگذاری...

</div>


</div>







<!-- پنل مدیریت -->


<div id="admin" class="box hidden">


<h2>
🔐 پنل مدیریت
</h2>


<input placeholder="رمز مدیر">


<button>
ورود
</button>


</div>




</div>






<script>


function showPage(page){


document
.querySelectorAll(".box")
.forEach(x=>{

x.classList.add("hidden");

});



document
.getElementById(page)
.classList
.remove("hidden");


}



</script>



</body>

</html>
