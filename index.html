<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Footballers | فوتبالیست‌ها و رسا</title>


<style>

*{
box-sizing:border-box;
font-family:tahoma;
}


body{

margin:0;
background:#050505;
color:white;

}



header{

background:linear-gradient(135deg,#000,#3a2b00);
padding:30px;
text-align:center;
border-bottom:3px solid gold;

}


.logo{

font-size:60px;

}



h1{

color:#ffd700;
font-size:40px;

}


h2{

color:white;

}



.container{

max-width:900px;
margin:auto;
padding:20px;

}



.box{

background:#111;
border:2px solid gold;
border-radius:25px;
padding:25px;
margin-top:25px;
box-shadow:0 0 25px #ffd70055;

}



input{

width:100%;
padding:15px;
border-radius:15px;
border:none;
font-size:18px;
margin:10px 0;

}



.status{

display:flex;
gap:10px;

}



button{

flex:1;
padding:15px;
border:none;
border-radius:20px;
font-size:18px;
font-weight:bold;
cursor:pointer;

}



.green{

background:#009933;
color:white;

}



.red{

background:#cc0000;
color:white;

}



.yellow{

background:#d6b600;

}



.link{

display:block;
margin-top:25px;
text-align:center;
color:gold;
font-size:18px;
text-decoration:none;

}


</style>


</head>



<body>


<header>


<div class="logo">
⚽
</div>


<h1>
Footballers
</h1>


<h2>
فوتبالیست‌ها و رسا
</h2>


</header>





<div class="container">


<div class="box">


<h2>
👤 ثبت حضور بازیکن
</h2>



<input 
id="playerName"
placeholder="اسم خودتو وارد کن">





<div class="status">


<button 
class="green"
onclick="savePlayer('میام')">

🟢 میام

</button>



<button 
class="red"
onclick="savePlayer('نمیام')">

🔴 نمیام

</button>




<button 
class="yellow"
onclick="savePlayer('شاید')">

🟡 شاید

</button>


</div>



</div>



<a class="link" href="players.html">

🏆 مشاهده جدول بازیکنان

</a>



</div>





<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getDatabase,
ref,
push,
set

}

from 

"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";





const firebaseConfig = {

apiKey: "AIzaSyDQNeMq85viJrlXI3VhpkYai5lcQK5w6FA",

authDomain: "footballers-273ab.firebaseapp.com",

databaseURL: "https://footballers-273ab-default-rtdb.firebaseio.com",

projectId: "footballers-273ab",

storageBucket: "footballers-273ab.firebasestorage.app",

messagingSenderId: "354306335709",

appId: "1:354306335709:web:bb778c2c40898a4824cc34"

};





const app = initializeApp(firebaseConfig);


const db = getDatabase(app);





window.savePlayer=function(status){



let name=document
.getElementById("playerName")
.value
.trim();




if(name===""){


alert("اسم رو وارد کن ⚽");

return;


}




let player=push(ref(db,"players"));




set(player,{

name:name,

status:status,

goals:0,

assists:0,

games:0,

score:0,

photo:""

});





alert("ثبت شد ✅");



document
.getElementById("playerName")
.value="";



}



</script>



</body>

</html>
