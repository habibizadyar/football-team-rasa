<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Footballers ⚽</title>

<style>

*{
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#302500 0%,#090909 35%,#050505 100%);
    color:white;
}

/* =========================
   HEADER
========================= */

header{
    text-align:center;
    padding:25px 15px 30px;
    background:linear-gradient(135deg,#000,#3a2b00);
    border-bottom:2px solid #ffd700;
}

.logo{
    font-size:62px;
}

header h1{
    margin:8px 0;
    color:#ffd700;
    font-size:40px;
}

header p{
    margin:0;
    color:#ddd;
    font-size:17px;
}

/* =========================
   CONTAINER
========================= */

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:18px;
}

/* =========================
   MENU
========================= */

.menu{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:18px;
}

.menu button{
    border:none;
    padding:15px 10px;
    border-radius:16px;
    background:linear-gradient(135deg,#ffd700,#c49a00);
    color:#000;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.menu button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(255,215,0,.18);
}

/* =========================
   PAGES
========================= */

.page{
    background:#111;
    border:2px solid #ffd700;
    border-radius:24px;
    padding:22px;
    box-shadow:0 0 25px rgba(255,215,0,.10);
}

.hidden{
    display:none !important;
}

.page-title{
    text-align:center;
    color:#ffd700;
    font-size:30px;
    margin-top:0;
}

/* =========================
   INPUT
========================= */

input{
    width:100%;
    padding:14px;
    margin:7px 0;
    border-radius:13px;
    border:1px solid #444;
    background:#1b1b1b;
    color:white;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#ffd700;
}

input[type="file"]{
    padding:10px;
}

/* =========================
   BUTTONS
========================= */

button{
    cursor:pointer;
}

.primary-btn{
    width:100%;
    border:none;
    border-radius:14px;
    padding:14px;
    margin-top:8px;
    background:#ffd700;
    color:#000;
    font-weight:bold;
    font-size:16px;
}

.green{
    background:#009933;
    color:white;
}

.red{
    background:#c90000;
    color:white;
}

.yellow{
    background:#d6b600;
    color:#000;
}

/* =========================
   ATTENDANCE
========================= */

.status-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:10px;
}

.status-buttons button{
    border:none;
    padding:15px;
    border-radius:15px;
    font-size:16px;
    font-weight:bold;
}

.message{
    margin-top:15px;
    padding:12px;
    text-align:center;
    background:#181818;
    border-radius:13px;
    color:#bbb;
}

.attendance-section{
    background:#181818;
    border:1px solid #333;
    border-radius:16px;
    padding:15px;
    margin-top:12px;
}

.attendance-section h3{
    margin-top:0;
    color:#ffd700;
}

.attendance-names{
    line-height:2.2;
    font-size:17px;
}

/* =========================
   PLAYERS GRID
========================= */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

/* =========================
   FIFA STYLE CARD
========================= */

.fifa-card{
    position:relative;
    min-height:430px;
    overflow:hidden;
    border-radius:24px;
    padding:18px;
    text-align:center;

    background:
        linear-gradient(
            145deg,
            #665000 0%,
            #211b05 25%,
            #080808 60%,
            #3c2e00 100%
        );

    border:3px solid #ffd700;

    box-shadow:
        0 0 15px rgba(255,215,0,.18),
        inset 0 0 30px rgba(255,215,0,.05);
}

/* خطوط تزئینی کارت */

.fifa-card::before{
    content:"";
    position:absolute;
    inset:8px;
    border:1px solid rgba(255,215,0,.35);
    border-radius:19px;
    pointer-events:none;
}

.fifa-card::after{
    content:"⚽";
    position:absolute;
    left:-15px;
    bottom:-25px;
    font-size:120px;
    opacity:.04;
    pointer-events:none;
}

/* =========================
   CARD TOP
========================= */

.card-top{
    position:relative;
    z-index:2;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding:4px 5px;
}

.rating{
    font-size:45px;
    font-weight:bold;
    color:#ffd700;
    line-height:1;
}

.rating-label{
    font-size:13px;
    color:#bbb;
    margin-top:5px;
}

.position{
    font-size:18px;
    color:#ddd;
    margin-top:7px;
}

/* =========================
   PHOTO
========================= */

.player-photo{
    position:relative;
    z-index:2;

    width:190px;
    height:190px;

    margin:5px auto 10px;

    border-radius:50%;

    object-fit:cover;

    border:4px solid #ffd700;

    background:#222;

    box-shadow:
        0 0 20px rgba(255,215,0,.25);
}

.no-photo{
    position:relative;
    z-index:2;

    width:190px;
    height:190px;

    margin:5px auto 10px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:4px solid #ffd700;

    background:#222;

    font-size:75px;
}

/* =========================
   PLAYER NAME
========================= */

.fifa-name{
    position:relative;
    z-index:2;

    color:#ffd700;
    font-size:26px;
    font-weight:bold;

    margin:8px 0;
}

/* =========================
   AGE
========================= */

.age{
    position:relative;
    z-index:2;

    color:#ddd;
    font-size:15px;
    margin-bottom:14px;
}

/* =========================
   CARD STATS
========================= */

.card-stats{
    position:relative;
    z-index:2;

    display:grid;
    grid-template-columns:repeat(3,1fr);

    gap:7px;

    margin-top:10px;
}

.card-stat{
    background:rgba(0,0,0,.45);
    border:1px solid rgba(255,215,0,.3);
    border-radius:12px;
    padding:8px 4px;
}

.card-stat strong{
    display:block;
    color:#ffd700;
    font-size:20px;
    margin-top:3px;
}

.card-stat span{
    color:#ccc;
    font-size:12px;
}

/* =========================
   ADMIN
========================= */

.admin-box{
    background:#181818;
    border:1px solid #333;
    border-radius:18px;
    padding:18px;
    margin-bottom:20px;
}

.admin-box h3{
    color:#ffd700;
    text-align:center;
    margin-top:0;
}

.admin-card{
    text-align:right;
}

.admin-card h3{
    text-align:center;
    color:#ffd700;
}

.admin-label{
    display:block;
    color:#aaa;
    font-size:13px;
    margin-top:8px;
}

.save-btn{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:none;
    border-radius:13px;
    background:#ffd700;
    color:#000;
    font-weight:bold;
    font-size:15px;
}

.delete-btn{
    width:100%;
    padding:11px;
    margin-top:8px;
    border:none;
    border-radius:13px;
    background:#9b0000;
    color:white;
    font-weight:bold;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    color:#aaa;
    padding:25px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .menu{
        grid-template-columns:1fr;
    }

    .status-buttons{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:34px;
    }

    .page{
        padding:16px;
    }

    .fifa-card{
        min-height:420px;
    }

}

</style>

<script type="module">

const app =

const db =

/* =========================
   CHANGE PAGE
========================= */

window.showPage = function(pageId){

    const pages = [

        "attendancePage",
        "playersPage",
        "adminPage"

    ];

    pages.forEach(id => {

        const page =
            document.getElementById(id);

        if(page){

            page.classList.add("hidden");

        }

    });


    const selected =
        document.getElementById(pageId);


    if(selected){

        selected.classList.remove("hidden");

    }

};


/* =========================
   STATUS ICON
========================= */

function statusIcon(status){

    if(status === "میام"){
        return "🟢";
    }

    if(status === "نمیام"){
        return "🔴";
    }

    if(status === "شاید"){
        return "🟡";
    }

    return "⚪";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

    return String(value ?? "")

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   IMAGE TO BASE64
========================= */

function imageToBase64(file){

    return new Promise((resolve,reject)=>{

        const reader =
            new FileReader();


        reader.onload = () => {

            resolve(reader.result);

        };


        reader.onerror = reject;


        reader.readAsDataURL(file);

    });

}


/* =========================
   SAVE ATTENDANCE
========================= */

async function savePlayer(status){

    const input =
        document.getElementById("playerName");


    const message =
        document.getElementById(
            "attendanceMessage"
        );


    const name =
        input.value.trim();


    if(!name){

        message.textContent =
            "اول اسم بازیکن را وارد کن ⚽";

        return;

    }


    try{

        const playerRef =
            push(ref(db,"players"));


        await set(playerRef,{

            name:name,

            age:0,

            photo:"",

            status:status,

            goals:0,

            assists:0,

            games:0,

            score:0

        });


        message.textContent =
            "اعلام حضور با موفقیت ثبت شد ✅";


        input.value = "";

    }

    catch(error){

        console.error(error);

        message.textContent =
            "ثبت اطلاعات انجام نشد ❌";

        alert(
            "خطا در اتصال به Firebase"
        );

    }

}

document

/* =========================
   LOAD ATTENDANCE
========================= */

function loadAttendance(){

    onValue(
        ref(db,"players"),
        snapshot => {

            const come = [];
            const no = [];
            const maybe = [];


            snapshot.forEach(item => {

                const player =
                    item.val();


                if(player.status === "میام"){

                    come.push(player.name);

                }

                else if(
                    player.status === "نمیام"
                ){

                    no.push(player.name);

                }

                else if(
                    player.status === "شاید"
                ){

                    maybe.push(player.name);

                }

            });


            const html = `

                <div class="attendance-section">

                    <h3>
                        🟢 میان
                        (${come.length})
                    </h3>

                    <div class="attendance-names">

                        ${
                            come.length
                            ? come.map(
                                name =>
                                "🟢 " +
                                escapeHtml(name)
                              ).join("<br>")
                            : "کسی ثبت نکرده"
                        }

                    </div>

                </div>


                <div class="attendance-section">

                    <h3>
                        🔴 نمیان
                        (${no.length})
                    </h3>

                    <div class="attendance-names">

                        ${
                            no.length
                            ? no.map(
                                name =>
                                "🔴 " +
                                escapeHtml(name)
                              ).join("<br>")
                            : "کسی ثبت نکرده"
                        }

                    </div>

                </div>


                <div class="attendance-section">

                    <h3>
                        🟡 شاید
                        (${maybe.length})
                    </h3>

                    <div class="attendance-names">

                        ${
                            maybe.length
                            ? maybe.map(
                                name =>
                                "🟡 " +
                                escapeHtml(name)
                              ).join("<br>")
                            : "کسی ثبت نکرده"
                        }

                    </div>

                </div>

            `;


            document
                .getElementById(
                    "attendanceList"
                )
                .innerHTML = html;

        }

    );

}


/* =========================
   LOAD PLAYER CARDS
========================= */

function loadPlayers(){

    onValue(
        ref(db,"players"),
        snapshot => {

            const players = [];


            snapshot.forEach(item => {

                players.push({

                    id:item.key,

                    ...item.val()

                });

            });


            players.sort(

                (a,b) =>

                (Number(b.score) || 0) -

                (Number(a.score) || 0)

            );


            const container =
                document.getElementById(
                    "playerCards"
                );


            if(!players.length){

                container.innerHTML = `

                    <div class="empty">

                        هنوز بازیکنی ثبت نشده ⚽

                    </div>

                `;

                return;

            }


            let html = "";


            players.forEach(player => {

                const score =
                    Number(player.score) || 0;


                const goals =
                    Number(player.goals) || 0;


                const assists =
                    Number(player.assists) || 0;


                const games =
                    Number(player.games) || 0;


                const age =
                    Number(player.age) || 0;


                let photoHtml = "";


                if(player.photo){

                    photoHtml = `

                        <img
                            class="player-photo"
                            src="${player.photo}"
                            alt="${escapeHtml(player.name)}"
                        >

                    `;

                }

                else{

                    photoHtml = `

                        <div class="no-photo">
                            ⚽
                        </div>

                    `;

                }


                html += `

                    <div class="fifa-card">

                        <div class="card-top">

                            <div>

                                <div class="rating">
                                    ${score}
                                </div>

                                <div class="rating-label">
                                    RATING
                                </div>

                                <div class="position">
                                    ⚽
                                </div>

                            </div>


                            <div class="position">

                                ${statusIcon(player.status)}

                            </div>

                        </div>


                        ${photoHtml}


                        <div class="fifa-name">

                            ${escapeHtml(player.name)}

                        </div>


                        <div class="age">

                            👤 سن:
                            ${
                                age > 0
                                ? age
                                : "ثبت نشده"
                            }

                        </div>


                        <div class="card-stats">

                            <div class="card-stat">

                                ⚽
                                <span>گل</span>

                                <strong>
                                    ${goals}
                                </strong>

                            </div>


                            <div class="card-stat">

                                🎯
                                <span>پاس گل</span>

                                <strong>
                                    ${assists}
                                </strong>

                            </div>


                            <div class="card-stat">

                                🏟
                                <span>بازی</span>

                                <strong>
                                    ${games}
                                </strong>

                            </div>

                        </div>

                    </div>

                `;

            });


            container.innerHTML = html;

        }

    );

}

/* =========================
   ADD NEW PLAYER
========================= */

async function addNewPlayer(){

    const nameInput =
        document.getElementById(
            "newPlayerName"
        );


    const ageInput =
        document.getElementById(
            "newPlayerAge"
        );


    const photoInput =
        document.getElementById(
            "newPlayerPhoto"
        );


    const name =
        nameInput.value.trim();


    const age =
        Number(ageInput.value) || 0;


    if(!name){

        alert(
            "اسم بازیکن را وارد کن ⚽"
        );

        return;

    }


    try{

        let photo = "";


        if(photoInput.files.length > 0){

            const file =
                photoInput.files[0];


            if(file.size > 3 * 1024 * 1024){

                alert(
                    "حجم عکس باید کمتر از 3 مگابایت باشد."
                );

                return;

            }


            photo =
                await imageToBase64(file);

        }


        const playerRef =
            push(ref(db,"players"));


        await set(playerRef,{

            name:name,

            age:age,

            photo:photo,

            status:"شاید",

            goals:0,

            assists:0,

            games:0,

            score:0

        });


        nameInput.value = "";
        ageInput.value = "";
        photoInput.value = "";


        alert(
            "بازیکن با موفقیت اضافه شد ✅"
        );

    }

    catch(error){

        console.error(error);

        alert(

/* =========================
   SAVE PLAYER
========================= */

window.saveStats = async function(id){

    const nameInput =
        document.getElementById(
            "name-" + id
        );


    const ageInput =
        document.getElementById(
            "age-" + id
        );


    const photoInput =
        document.getElementById(
            "photo-" + id
        );


    const goalsInput =
        document.getElementById(
            "goals-" + id
        );


    const assistsInput =
        document.getElementById(
            "assists-" + id
        );


    const gamesInput =
        document.getElementById(
            "games-" + id
        );


    const scoreInput =
        document.getElementById(
            "score-" + id
        );


    if(
        !nameInput ||
        !ageInput ||
        !goalsInput ||
        !assistsInput ||
        !gamesInput ||
        !scoreInput
    ){

        alert(
            "اطلاعات بازیکن پیدا نشد ❌"
        );

        return;

    }


    try{

        let photo = undefined;


        if(
            photoInput &&
            photoInput.files.length > 0
        ){

            const file =
                photoInput.files[0];


            if(file.size > 3 * 1024 * 1024){

                alert(
                    "حجم عکس باید کمتر از 3 مگابایت باشد."
                );

                return;

            }


            photo =
                await imageToBase64(file);

        }


        const data = {

            name:
                nameInput.value.trim(),

            age:
                Number(ageInput.value) || 0,

            goals:
                Number(goalsInput.value) || 0,

            assists:
                Number(assistsInput.value) || 0,

            games:
                Number(gamesInput.value) || 0,

            score:
                Number(scoreInput.value) || 0

        };


        if(photo !== undefined){

            data.photo = photo;

        }


        await update(

            ref(
                db,
                "players/" + id
            ),

            data

        );


        alert(
            "اطلاعات بازیکن ذخیره شد ✅"
        );

    }

    catch(error){

        console.error(error);

        alert(
            "ذخیره انجام نشد ❌"
        );

    }

};


/* =========================
   DELETE PLAYER
========================= */

window.deletePlayer = async function(id){

    const answer =
        confirm(
            "مطمئنی می‌خواهی این بازیکن حذف شود؟"
        );


    if(!answer){

        return;

    }


    try{

        await remove(
            ref(
                db,
                "players/" + id
            )
        );


        alert(
            "بازیکن حذف شد ✅"
        );

    }

    catch(error){

        console.error(error);

        alert(
            "حذف بازیکن انجام نشد ❌"
        );

    }

};
