<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بازیکنان رسا</title>

<style>

body{
margin:0;
font-family:Tahoma,Arial;
background:#111;
color:white;
text-align:center;
}

h1{
color:#ffd700;
margin:30px;
}

.container{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:25px;
}

.card{
width:280px;
background:linear-gradient(145deg,#d4af37,#fff2a8);
border-radius:25px;
padding:20px;
color:#111;
box-shadow:0 0 20px #ffd700;
}

.photo{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
border:4px solid white;
}

.name{
font-size:25px;
font-weight:bold;
margin:15px;
}

.rating{
font-size:40px;
font-weight:bold;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{
background:#ffffff88;
border-radius:10px;
padding:10px;
}

</style>

</head>


<body>

<h1>⚽ بازیکنان رسا</h1>

<div class="container" id="players">
در حال بارگذاری...
</div>


<script>

const SUPABASE_URL =
"https://vviuzqnnnghaidnwyomt.supabase.co";


const SUPABASE_KEY =
"sb_publishable_olTL-pgnq7q-RISyGG0Mjw_vI7Ofl_T";


async function loadPlayers(){


try{


let response = await fetch(

SUPABASE_URL +
"/rest/v1/player_stats?select=*",

{

method:"GET",

headers:{

"apikey": SUPABASE_KEY,

"Authorization": "Bearer " + SUPABASE_KEY

}

}

);



let players = await response.json();


console.log(players);



if(!Array.isArray(players)){

document.getElementById("players").innerHTML =
"❌ خطا در دریافت اطلاعات";

console.log(players);

return;

}



let box=document.getElementById("players");

box.innerHTML="";



players.forEach(p=>{


box.innerHTML += `

<div class="card">


<div class="rating">
⭐ ${p.score || 0}
</div>


<img class="photo"
src="${p.photo || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}">


<div class="name">
${p.player_name}
</div>


<h3>
${p.position || "PLAYER"}
<br>
👕 ${p.number || 0}
</h3>


<div class="stats">

<div class="stat">
⚽ گل
<br>
${p.goals || 0}
</div>


<div class="stat">
🅰️ پاس گل
<br>
${p.assists || 0}
</div>


<div class="stat">
🎮 بازی
<br>
${p.matches || 0}
</div>


<div class="stat">
🏆 برد
<br>
${p.wins || 0}
</div>


</div>


</div>

`;


});


}

catch(error){

console.log(error);

document.getElementById("players").innerHTML =
"❌ مشکل اتصال";

}


}


loadPlayers();


</script>


</body>

</html>
